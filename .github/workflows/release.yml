on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            asset: notch-macos-arm64
            bundle: notch.app
            extension: tar.gz
          - runner: ubuntu-24.04
            asset: notch-linux-x86_64
            bundle: notch
            extension: tar.gz
          - runner: ubuntu-24.04-arm
            asset: notch-linux-arm64
            bundle: notch
            extension: tar.gz
          - runner: windows-2022
            asset: notch-windows-x86_64
            bundle: notch
            extension: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build shaded JAR
        run: mvn -B -ntp verify

      - name: Stage jpackage input
        shell: bash
        run: |
          mkdir -p staging
          cp target/notch.jar staging/

      - name: Run jpackage (Unix)
        if: runner.os != 'Windows'
        run: >
          jpackage --type app-image --name notch
          --input staging --main-jar notch.jar
          --main-class edu.montana.notch.console.NotchShell
          --dest target/jpackage
          --java-options "--enable-native-access=ALL-UNNAMED"

      - name: Run jpackage (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          jpackage --type app-image --name notch
          --input staging --main-jar notch.jar
          --main-class edu.montana.notch.console.NotchShell
          --dest target/jpackage
          --win-console
          --java-options "--enable-native-access=ALL-UNNAMED"

      - name: Archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C target/jpackage -czf ${{ matrix.asset }}.tar.gz ${{ matrix.bundle }}

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target\jpackage\${{ matrix.bundle }} -DestinationPath ${{ matrix.asset }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
