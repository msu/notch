<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "Notch",
  "applicationCategory": "DeveloperApplication",
  "operatingSystem": "Cross-platform (JVM)",
  "description": "{{ site.description }}",
  "url": "{{ site.url }}"
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@100..900&display=swap" rel="stylesheet">

<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/notch-no-text.svg' | relative_url }}">

<script>
(function(){
  var d=document.documentElement;
  if(localStorage.getItem('navs-collapsed')==='true')d.classList.add('navs-collapsed');
  var w=parseInt(localStorage.getItem('nav-width'));
  if(w>=160&&w<=400)d.style.setProperty('--nav-width',w+'px');
  if(/Mac|iPhone|iPad|iPod/.test(navigator.platform||navigator.userAgent))d.classList.add('mac');
})();
</script>
