# Site settings
title: Notch
tagline: "A scripting language for the Java & Minecraft."
description: "Notch is a powerful and customizable scripting and programming language built for the Java ecosystem. Seamless JVM integration, sane null propagation, syntax extensibility."
author: Notch contributors

# Build settings
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# URL settings
url: "https://notch.cs.montana.edu"
baseurl: ""

# Build exclusions
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - README.md

# Markdown settings - ASCII only enforced via smartquotes:false
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  smart_quotes: ["apos", "apos", "quot", "quot"]

# Permalink structure
permalink: pretty

# Collections
collections:
  getting-started:
    output: true
    permalink: /getting-started/:name/
  language:
    output: true
    permalink: /language/:name/
  templates:
    output: true
    permalink: /templates/:name/
  repl:
    output: true
    permalink: /repl/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "getting-started"
    values:
      layout: "docs"
      collection: "getting-started"
  - scope:
      path: ""
      type: "language"
    values:
      layout: "docs"
      collection: "language"
  - scope:
      path: ""
      type: "templates"
    values:
      layout: "docs"
      collection: "templates"
  - scope:
      path: ""
      type: "repl"
    values:
      layout: "docs"
      collection: "repl"
