# Site settings
title: Notch
tagline: "A scripting & programming language for the JVM"
description: "Notch is a scripting and programming language for the JVM, from Montana State University (MSU). Seamless Java interop, sane null propagation, syntax extensibility, and an interactive REPL."
author: Notch contributors

# Build settings
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# URL settings
url: "https://notch.cs.montana.edu"
baseurl: ""

# Build exclusions
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - README.md

# Markdown settings - ASCII only enforced via smartquotes:false
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  smart_quotes: ["apos", "apos", "quot", "quot"]

# Permalink structure
permalink: pretty

# Collections
collections:
  getting-started:
    output: true
    permalink: /getting-started/:name/
  language:
    output: true
    permalink: /language/:name/
  templates:
    output: true
    permalink: /templates/:name/
  repl:
    output: true
    permalink: /repl/:name/

# Defaults
defaults:
  # Social preview card (og:image / twitter:image) for every page.
  # jekyll-seo-tag reads `image` from page front matter, not site config,
  # so it has to be injected here rather than set as a top-level key.
  - scope:
      path: ""
    values:
      image: /assets/images/og-card.png
  - scope:
      path: ""
      type: "getting-started"
    values:
      layout: "docs"
      collection: "getting-started"
  - scope:
      path: ""
      type: "language"
    values:
      layout: "docs"
      collection: "language"
  - scope:
      path: ""
      type: "templates"
    values:
      layout: "docs"
      collection: "templates"
  - scope:
      path: ""
      type: "repl"
    values:
      layout: "docs"
      collection: "repl"
