---
layout: default
---

<div class="docs-layout">
  <div class="docs-content">
    {% if page.title %}
    <header class="docs-header">
      <h1>{{ page.title }}</h1>
      {% if page.subtitle %}
      <p class="docs-subtitle">{{ page.subtitle }}</p>
      {% endif %}
    </header>
    {% endif %}

    <div class="docs-body">
      {{ content }}
    </div>
  </div>
  {% if page.order %}
  <aside class="docs-toc" aria-label="On this page">
    <div class="docs-toc-inner">
      <h3 class="docs-toc-heading">On this page</h3>
      <ul class="docs-toc-list"></ul>
    </div>
  </aside>
  {% endif %}
</div>
