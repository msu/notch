# Source of truth for the Notch error index page and its search entries.
#
# Drift-checked against the Java error enums by ErrorIndexDocsDriftTest: every
# ParserError constant must appear here exactly once, in declaration order, and
# non-templated titles must match the enum verbatim.
#
# Entries must keep the two-line '- code:' / '  title:' shape the test parses.
# ASCII only.
#
# Every example below was verified to actually produce its code, except EP0010 -
# see the note in that entry.

- code: "EP0001"
  title: "expected condition after 'if' operator"
  summary: >
    The trailing `if` operator selects between values, so it needs a condition to
    test. Notch reports this when the line ends before one appears.
  example: |
    x = 1 if
  fix: >
    Supply the condition after `if`, and a value after `else`, as in
    `x = 1 if ready else 0`.

- code: "EP0002"
  title: "expected value after 'else' in 'if' expression"
  summary: >
    The trailing `if` operator always produces a value, so both branches must be
    present. The condition was read but nothing followed `else`.
  example: |
    x = 1 if true else
  fix: >
    Give `else` a value, as in `x = 1 if true else 0`. Unlike the `if` statement,
    the `if` operator cannot leave a branch empty.

- code: "EP0003"
  title: "expected expression after an operator"
  summary: >
    A binary operator needs a value on both sides. The left side and the operator
    were read, then the input ended or an unusable token followed. The message
    names the operator involved.
  example: |
    x = 1 +
  fix: >
    Complete the right side of the operator, or remove the operator if it was a
    typo.

- code: "EP0004"
  title: "'catch' is not allowed in a recover expression"
  summary: >
    `recover` produces a replacement value when an expression fails. It is an
    expression-level construct, so it has no body in which statements could run,
    and `catch` therefore has nothing to attach to.
  example: |
    x = foo() catch 1
  fix: >
    Use `recover` to substitute a value - `x = foo() recover with 1` - or a block
    `try` / `catch` when you need statements to run on failure.

- code: "EP0005"
  title: "expected expression after recover type"
  summary: >
    A typed recover names the failure it handles and then the value to use
    instead. The type was read but no replacement value followed.
  example: |
    x = foo() recover from RuntimeException
  fix: >
    Add the replacement value after the type, as in
    `x = foo() recover from RuntimeException 0`.

- code: "EP0006"
  title: "unexpected token after recover: expected 'recover' or end of line"
  summary: >
    A recover clause is complete, but more input followed on the same line that
    is not another `recover`. Recover clauses chain only with `recover`.
  example: |
    x = foo() recover from A 1 bogus
  fix: >
    End the line after the recovery value, or start the next clause with
    `recover`.

- code: "EP0007"
  title: "expected ',' between arguments"
  summary: >
    Call arguments are comma separated. One argument was read and another began
    without a separator between them.
  example: |
    foo(1 2)
  fix: >
    Put a comma between the arguments, as in `foo(1, 2)`.

- code: "EP0008"
  title: "expected ')' to close the argument list"
  summary: >
    An argument list was opened but never closed - the input ended, or a token
    appeared that cannot continue the list.
  example: |
    foo(
  fix: >
    Add the closing parenthesis. If the call spans lines, check that no earlier
    argument is missing its comma.

- code: "EP0009"
  title: "expected a closing parenthesis"
  summary: >
    A parenthesised group was opened but never closed. If the offending token is
    `=`, Notch adds a note - a common cause is writing assignment where a
    comparison was meant.
  example: |
    (1 + 2
  fix: >
    Add the closing parenthesis. If you meant to compare two values, use `==`;
    `=` assigns.

- code: "EP0010"
  title: "a keyword cannot be used as a property name"
  summary: >
    Notch keywords are reserved everywhere, including after a dot, so a member
    whose name collides with one cannot be reached with member-access syntax.
    The message names the keyword involved.
  example: |
    x.throw
  fix: >
    Rename the member if it is yours. A JVM member whose name collides with a
    Notch keyword - `System.out.print`, for instance - is currently unreachable
    through member access; there is no workaround short of wrapping it in Java.

- code: "EP0011"
  title: "expected a statement"
  summary: >
    The parser found a token that can neither begin a statement nor continue the
    previous one. This is the general fallback when nothing more specific fits,
    and often follows recovery from an earlier error.
  example: |
    end
  fix: >
    Check for a stray token, an unbalanced `end`, or a construct that was left
    incomplete on an earlier line.

- code: "EP0012"
  title: "cannot assign to this expression"
  summary: >
    The left side of an assignment must name a place a value can be stored - a
    variable, a property, or an indexed element. A computed expression is not one.
  example: |
    x + 1 = 5
  fix: >
    Assign to a variable, property, or index. If you meant to compare, use `==`.

- code: "EP0013"
  title: "this expression cannot be used as a statement"
  summary: >
    A statement must do something: call a function or method, or assign. An
    expression that only produces a value and discards it is reported here.
  example: |
    foo
    bar = 5
  fix: >
    Assign the value to a variable, pass it somewhere, or `return` it if you are
    inside a function or closure.

- code: "EP0014"
  title: "expected an expression after 'throw' on the same line"
  summary: >
    `throw` needs the value to raise, and it must appear on the same line. A
    value on the next line is a separate statement.
  example: |
    throw
  fix: >
    Put the value on the same line, as in `throw 'boom'` or
    `throw RuntimeException('boom')`.

- code: "EP0015"
  title: "'rethrow' outside a catch"
  summary: >
    `rethrow` re-raises the exception a `catch` is currently handling, so it is
    only meaningful inside one.
  example: |
    rethrow
  fix: >
    Move the `rethrow` inside a `catch` body, or use `throw` with an explicit
    value.

- code: "EP0016"
  title: "catch body must start on a new line"
  summary: >
    The `catch` clause header - the type, and an optional `as` binding - occupies
    its own line. The body begins on the line after.
  example: |
    try
      print(1)
    catch RuntimeException print(2)
    end
  fix: >
    Move the body to the next line. To bind the exception, finish the header with
    `as`, as in `catch RuntimeException as e`.

- code: "EP0017"
  title: "expected 'times' after count expression in 'repeat'"
  summary: >
    The counted form of `repeat` reads `repeat <count> times`. The count was read
    but the `times` keyword did not follow.
  example: |
    repeat 3
    end
  fix: >
    Add `times` after the count - `repeat 3 times` - or use `repeat while <cond>`
    for a conditional loop.

- code: "EP0018"
  title: "'break' / 'continue' outside a loop"
  summary: >
    `break` and `continue` only mean something inside a loop body. Notch reports
    this when one appears at the top level, inside a function body, or inside a
    closure that is not itself within a loop.
  example: |
    print('start')
    break
  fix: >
    Move the statement inside a loop body, or remove it. Note that a closure
    defined inside a loop still cannot `break` the enclosing loop - the closure is
    its own body, and the loop has already moved on by the time it runs.

- code: "EP0019"
  title: "'return' outside a function"
  summary: >
    `return` hands a value back to a caller, so it needs a function or closure to
    return from. At the top level there is no caller.
  example: |
    return 1
  fix: >
    Move the `return` inside a `function` or a closure body. At the top level,
    assign the value or print it instead.

- code: "EP0020"
  title: "expected a 'field' or 'function' declaration in the class body"
  summary: >
    A class body holds only field and method declarations. Statements do not run
    directly in it, so anything that is not a `field` or `function` is reported
    here.
  example: |
    class P
      x = 1
    end
  fix: >
    Declare the member with `field x`, and set its value in a method. Move any
    executable code into a `function`.

- code: "EP0021"
  title: "cannot assign to 'this'"
  summary: >
    `this` is bound by the runtime to the object whose method is executing. It is
    not a variable, so it cannot be reassigned.
  example: |
    class P
      function f()
        this = 1
      end
    end
  fix: >
    Assign to a field on the object instead, as in `this.x = 1`.

- code: "EP0022"
  title: "a keyword cannot be used as a loop variable name"
  summary: >
    The loop variable in a `for` is a new name bound on each iteration, so it
    must be an identifier. Keywords are reserved and cannot be rebound.
  example: |
    for print in [1]
    end
  fix: >
    Choose a name that is not a keyword, such as `item` or `value`.

- code: "EP0023"
  title: "expected a conditional expression after 'if'"
  summary: >
    An `if` statement tests a condition, which must follow the `if` on the same
    line. Nothing usable was found.
  example: |
    if
    end
  fix: >
    Supply the condition, as in `if x > 0`. For the value-selecting form, see
    EP0001.

- code: "EP0024"
  title: "expected '(' after 'print'"
  summary: >
    `print` is a keyword and its arguments are always parenthesised. When an
    argument follows on the same line without parentheses, Notch adds a note
    showing the intended form.
  example: |
    print hello
  fix: >
    Wrap the arguments in parentheses, as in `print(hello)`.

- code: "EP0025"
  title: "expected ')' to close the print arguments"
  summary: >
    The argument list for `print` was opened but never closed.
  example: |
    print(1
  fix: >
    Add the closing parenthesis.

- code: "EP0026"
  title: "a declaration keyword from another language is not valid here"
  summary: >
    Notch has no `var`, `let`, `const`, or type-name declaration syntax. A
    variable comes into existence when you assign to it. The message names the
    word that was used.
  example: |
    var hello = 1
  fix: >
    Drop the keyword and assign directly, as in `hello = 1`.

- code: "EP0027"
  title: "expected an expression after 'recover'"
  summary: >
    An untyped recover handles any failure, so `recover with` must be followed by
    the value to use when the guarded expression fails. Nothing followed it here.
    This is the untyped counterpart of EP0005: no exception type was named, so the
    parser was waiting on the replacement value alone.
  example: |
    x = foo() recover with
  fix: >
    Add the replacement value after `with`, as in `x = foo() recover with 0`. To
    handle one specific failure instead, name the type: `recover from IOException
    with 0`, which reports EP0005 when its value is missing.

- code: "EP0028"
  title: "expected an index expression"
  summary: >
    Indexing with `[` and `]` needs a value between the brackets saying which
    element to reach. The brackets were found empty. Notch has no "whole slice"
    meaning for `[]`.
  example: |
    arr[] = 5
  fix: >
    Put the index between the brackets, as in `arr[0] = 5`. To append to a list,
    use its `add` method rather than an empty index.

- code: "EP0029"
  title: "expected an expression to throw"
  summary: >
    `throw` needs a value naming what to raise, and it must start on the same line
    as the keyword. Something followed `throw` on that line, but it could not begin
    an expression.
  example: |
    throw )
  fix: >
    Give `throw` an exception value, as in `throw RuntimeException("boom")`. If the
    line after `throw` is empty instead, that is EP0014.

- code: "EP0030"
  title: "expected a condition after a repeat guard"
  summary: >
    `repeat while` and `repeat until` both test a condition before each pass, so
    one has to follow the guard keyword. The message names which of the two was
    used.
  example: |
    repeat while
    end
  fix: >
    Supply the condition, as in `repeat while x < 10`. For a loop that runs a fixed
    number of times, use `repeat n times` instead.

- code: "EP0031"
  title: "expected a count expression after 'repeat'"
  summary: >
    A bare `repeat` starts a counted loop, so it needs an expression saying how
    many passes to make, followed by `times`. The loop body began before one
    appeared.
  example: |
    repeat
    end
  fix: >
    Give the count and keep `times`, as in `repeat 3 times`. For a condition-driven
    loop, write `repeat while ...` or `repeat until ...` instead.

- code: "EP0032"
  title: "expected an initializer expression after '='"
  summary: >
    A field declaration may give a default value with `=`, but the value itself was
    missing. This is the class-body form; an ordinary assignment reports EP0033.
  example: |
    class Foo()
      field x =
    end
  fix: >
    Give the field its default, as in `field x = 0`, or drop the `=` to leave the
    field uninitialized.

- code: "EP0033"
  title: "expected an expression after '='"
  summary: >
    An assignment needs a value on the right of `=`. The target and the `=` were
    read, then the line ended. This is the statement form; a class field default
    reports EP0032.
  example: |
    x =
  fix: >
    Supply the value, as in `x = 1`.

- code: "EP0034"
  title: "expected an expression for the loop iterable"
  summary: >
    A `for` loop walks a collection, so `in` must be followed by the thing to walk.
    The loop body began before one appeared.
  example: |
    for x in
    end
  fix: >
    Give the loop something to iterate, as in `for x in [1, 2, 3]`. Any list, set,
    or map works.

- code: "EP0035"
  title: "expected a property name"
  summary: >
    A `.` reaches into an object, so it must be followed by the name of the
    property or method to reach. The dot was read but no name followed.
  example: |
    x = a.
  fix: >
    Name the property after the dot, as in `x = a.size`. A dot cannot end a line.

- code: "EP0036"
  title: "expected a class name after 'new'"
  summary: >
    `new` constructs an instance, so it needs the name of the class to build.
    Nothing usable followed the keyword.
  example: |
    x = new
  fix: >
    Name the class and give it an argument list, as in `x = new Dog("Rex")`.

- code: "EP0037"
  title: "expected an alias after 'as'"
  summary: >
    In an import, `as` renames what was imported, so a name must follow it. The
    line ended first.
  example: |
    import java.util.List as
  fix: >
    Give the alias, as in `import java.util.List as JList`, or drop the `as`
    clause to keep the original name.

- code: "EP0038"
  title: "expected a binding name after 'as'"
  summary: >
    In a catch clause, `as` binds the caught exception to a variable, so it needs
    a name. Nothing followed it.
  example: |
    try
      print(1)
    catch IOException as
    end
  fix: >
    Name the variable, as in `catch IOException as e`, or drop the `as` clause if
    the exception value is not needed.

- code: "EP0039"
  title: "expected a parameter name"
  summary: >
    Parameters are declared by name. Something that is not an identifier appeared
    where a parameter name belongs - in a function declaration or a closure's
    parameter list.
  example: |
    function foo(1)
    end
  fix: >
    Use an identifier for each parameter, as in `function foo(count)`. Literals
    and keywords cannot be parameter names.

- code: "EP0040"
  title: "expected a function name"
  summary: >
    A function declaration names the function before its parameter list. The
    `function` keyword was read but no name followed. If a `(` followed directly,
    the error adds a note - Notch functions are always named, and an anonymous
    function is written as a closure instead.
  example: |
    function 1()
    end
  fix: >
    Give the function a name, as in `function greet()`. For an anonymous function,
    use a closure: `\ x -> x + 1`.

- code: "EP0041"
  title: "expected a class name"
  summary: >
    A class declaration names the class before its header. The `class` keyword was
    read but no name followed.
  example: |
    class 1
    end
  fix: >
    Give the class a name, as in `class Dog`.

- code: "EP0042"
  title: "expected a field name"
  summary: >
    A field declaration names the field after the `field` keyword. Something that
    is not an identifier appeared instead.
  example: |
    class Foo
      field 1
    end
  fix: >
    Name the field, as in `field age`, optionally with a type and default:
    `field age: Int = 0`.

- code: "EP0043"
  title: "expected a variable name for the loop item"
  summary: >
    A `for` loop binds each element to a variable, so a name must follow `for`.
    Something that is not an identifier appeared instead.
  example: |
    for 1 in [1]
    end
  fix: >
    Name the loop variable, as in `for item in [1, 2, 3]`.

- code: "EP0044"
  title: "expected a variable name for the loop index"
  summary: >
    The optional `index` clause of a `for` loop binds the position of each element
    to a variable, so it needs a name.
  example: |
    for x in [1] index 1
    end
  fix: >
    Name the index variable, as in `for x in [1, 2] index i`, or drop the `index`
    clause.

- code: "EP0045"
  title: "expected 'with' after a string comparison keyword"
  summary: >
    The `starts` and `ends` operators are spelled as two words. The first word was
    read but `with` did not follow. The message names which one was used.
  example: |
    x = "a" starts 1
  fix: >
    Add `with`, as in `x = "abc" starts with "a"` or `x = "abc" ends with "c"`.

- code: "EP0046"
  title: "expected 'end' to close a block"
  summary: >
    Every block form in Notch - `try`, `repeat`, `function`, `class`, `for` and the
    `if` statement - runs until a matching `end`. The input finished while one was
    still open. The message names which construct, and `try` and `if` add a note
    about their own shape.
  example: |
    if true
      print(1)
  fix: >
    Add `end` on its own line to close the block. For `try`, any `catch` clauses go
    before the `end`; the trailing `if` operator (`x = 1 if ready else 0`) is an
    expression and needs no `end` at all.

- code: "EP0047"
  title: "expected 'in' after the loop variable"
  summary: >
    A `for` loop is written `for <name> in <collection>`. The loop variable was
    read but `in` did not follow.
  example: |
    for x [1]
    end
  fix: >
    Add `in` between the variable and the collection, as in `for x in [1, 2, 3]`.

- code: "EP0048"
  title: "expected a type name after 'import'"
  summary: >
    An import names a Java type to bring into scope. The `import` keyword was read
    but no name followed.
  example: |
    import
  fix: >
    Name the type, as in `import java.util.List`. Notch reaches Java only through
    explicit imports or fully qualified names.

- code: "EP0049"
  title: "expected a type after ':'"
  summary: >
    A `:` introduces a type annotation - on a parameter, on a function's return, or
    on a field - so a type name must follow it. The colon was read but nothing
    usable came next. The message names which of the three positions it was.
  example: |
    function foo(x: )
    end
  fix: >
    Name the type, as in `function foo(x: Int): Int` or `field age: Int`, or drop
    the `:` to leave it untyped. A `:` introduces a type, never a value.

- code: "EP0050"
  title: "expected ']' to close the index expression"
  summary: >
    An index expression opens with `[` and must close with `]`. The index was read
    but the closing bracket never appeared.
  example: |
    x = arr[1
  fix: >
    Add the closing bracket, as in `x = arr[1]`.

- code: "EP0051"
  title: "expected '(' after the class name"
  summary: >
    `new` requires an argument list even when the constructor takes nothing. The
    class name was read but no `(` followed.
  example: |
    x = new Foo
  fix: >
    Add the argument list, as in `x = new Foo()`.

- code: "EP0052"
  title: "expected ',' between list elements"
  summary: >
    Elements of a list literal are separated by commas. Two elements appeared with
    nothing between them.
  example: |
    x = [1 2]
  fix: >
    Separate the elements, as in `x = [1, 2]`.

- code: "EP0053"
  title: "expected ']' to close the list"
  summary: >
    A list literal opens with `[` and must close with `]`. The input finished
    while the list was still open.
  example: |
    x = [
  fix: >
    Add the closing bracket, as in `x = [1, 2]` or `x = []` for an empty list.

- code: "EP0054"
  title: "expected '}' to close a brace literal"
  summary: >
    Sets and maps are written with braces and must be closed. The input finished
    while one was still open. The message names which - map, set, or the empty set
    - and the empty-set case adds a note, because `{,}` and `{}` mean different
    things.
  example: |
    x = {1 -> 2
  fix: >
    Add the closing brace, as in `x = {1 -> 2}` for a map or `x = {1, 2}` for a
    set. The empty set is `{,}`; `{}` on its own is the empty map.

- code: "EP0055"
  title: "expected '->' between a map key and value"
  summary: >
    Map entries are written `key -> value`. A key was read but no arrow followed,
    so the literal could not be read as a map.
  example: |
    x = {1 -> 2, 3}
  fix: >
    Give every entry an arrow, as in `x = {1 -> 2, 3 -> 4}`. For a set, drop the
    arrows entirely: `x = {1, 2}`.

- code: "EP0056"
  title: "expected ',' between parameters"
  summary: >
    Parameters are separated by commas, in both function declarations and closure
    parameter lists. Two parameters appeared with nothing between them.
  example: |
    function foo(a b)
    end
  fix: >
    Separate the parameters, as in `function foo(a, b)`.

- code: "EP0057"
  title: "expected '->' after the closure parameters"
  summary: >
    A closure is written `\ params -> body`. The parameter list was read but the
    arrow never appeared.
  example: |
    x = \
  fix: >
    Add the arrow, as in `x = \ a -> a + 1`. A closure with no parameters is
    written `\ -> ...`.

- code: "EP0058"
  title: "expected '}' to close the closure body"
  summary: >
    A block-bodied closure opens with `{` and must close with `}`. The input
    finished while the body was still open.
  example: |
    x = \ -> { print(1)
  fix: >
    Add the closing brace, as in `x = \ -> { print(1) }`. For a single expression,
    drop the braces: `x = \ -> 1`.

- code: "EP0059"
  title: "expected '(' after the function name"
  summary: >
    A function declaration always has a parameter list, even when empty. The name
    was read but no `(` followed.
  example: |
    function foo
    end
  fix: >
    Add the parameter list, as in `function foo()`.

- code: "EP0060"
  title: "expected ')' to close a declaration list"
  summary: >
    A function's parameter list and a class header's field list both open with `(`
    and must close with `)`. The input finished while one was still open; the
    message names which.
  example: |
    function foo(
  fix: >
    Add the closing parenthesis, as in `function foo(a, b)` or `class Foo(name)`.
